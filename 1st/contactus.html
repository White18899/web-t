<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="form.css">
</head>
<body class="iframe-body">
    <div class="form-card">
        <h2>Contact Us</h2>
        <form onsubmit="event.preventDefault(); alert('Sent'); this.reset();">
            <div class="form-group"><label>Full Name</label><input type="text" class="form-control" required></div>
            <div class="form-group"><label>Email</label><input type="email" class="form-control" required></div>
            <div class="form-group"><label>Subject</label><input type="text" class="form-control" required></div>
            <div class="form-group"><label>Message</label><textarea class="form-control" required></textarea></div>
            <button type="submit" class="btn">Send</button>
        </form>
    </div>
</body>
</html>
