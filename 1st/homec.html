<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5SJFYiLsQVIl--ckE4iidjKp69PnljRmzBcZw1B235A&s=10" alt="logo"> 
        <h1>Portal</h1>
    </header>
    <div class="container">
        <nav>
            <ul>
                <li><a href="regc.html" target="cf" class="nav-link active">Register</a></li>
                <li><a href="login.html" target="cf" class="nav-link">Login</a></li>
                <li><a href="contactus.html" target="cf" class="nav-link">Contact</a></li>
            </ul>
        </nav>
        <section class="content">
            <iframe name="cf" src="regc.html"></iframe>
        </section>
    </div>
    <script>
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => link.addEventListener('click', function() {
            links.forEach(l => l.classList.remove('active'));
            this.classList.add('active');
        }));
    </script>
</body>
</html>
