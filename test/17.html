<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Date and Time</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        button {
            font-size: 1.5rem;
            padding: 10px 20px;
            cursor: pointer;
        }

        p {
            font-size: 1.8rem;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <button onclick="showDateTime()">Show Date & Time</button>
    <p id="result"></p>

    <script>
        function showDateTime() {
            let current = new Date();
            document.getElementById("result").innerText = current;
        }
    </script>
</body>

</html>
